# Publish output/ (the blog gallery and every talk's blog page) to GitHub Pages.
name: Publish site

on:
  push:
    branches: [main]
    paths: ['output/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Keep this copy out of search engines: the posts are published on WordPress, and the same
      # text on two sites would split their ranking. Only the deployed copy changes, not the repo.
      - name: Add noindex to every page
        run: |
          find output -name '*.html' -print0 | xargs -0 perl -0pi -e \
            's/<meta name="robots"[^>]*>//gi; s/(<head\b[^>]*>)/$1\n<meta name="robots" content="noindex, nofollow">/i'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - id: deployment
        uses: actions/deploy-pages@v4
